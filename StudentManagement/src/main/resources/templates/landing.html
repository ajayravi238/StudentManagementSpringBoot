<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Student Management System</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-light: #ffffff;
            --secondary-light: #f0f4f8;
            --text-light: #2d3436;
            --glass-bg-light: rgba(255, 255, 255, 0.3);
            --button-light: linear-gradient(to right, #6a11cb, #2575fc);

            --primary-dark: #1e1e2f;
            --secondary-dark: #2b2b3d;
            --text-dark: #f5f6fa;
            --glass-bg-dark: rgba(30, 30, 47, 0.5);
            --button-dark: linear-gradient(to right, #ff416c, #ff4b2b);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #e0c3fc, #8ec5fc);
            background-size: 200% 200%;
            animation: moveBg 15s infinite alternate;
            transition: all 0.4s ease;
        }

        @keyframes moveBg {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }

        body.dark-mode {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
        }

        .container {
            max-width: 960px;
            margin: 5% auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 50px;
            border-radius: 20px;
            background: var(--glass-bg-light);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(18px);
            transition: all 0.4s ease;
        }

        body.dark-mode .container {
            background: var(--glass-bg-dark);
        }

        .left {
            flex: 1;
            padding-right: 40px;
            color: var(--text-light);
        }

        body.dark-mode .left {
            color: var(--text-dark);
        }

        .left h1 {
            font-size: 3rem;
            margin-bottom: 15px;
        }

        .left p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .right {
            flex: 1;
            text-align: center;
        }

        .right h2 {
            font-size: 2rem;
            margin-bottom: 30px;
            color: var(--text-light);
        }

        body.dark-mode .right h2 {
            color: var(--text-dark);
        }

        .button-grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        a.button {
            text-decoration: none;
            padding: 14px;
            border-radius: 10px;
            font-weight: 600;
            color: #fff;
            background: var(--button-light);
            transition: all 0.3s ease;
        }

        body.dark-mode a.button {
            background: var(--button-dark);
        }

        a.button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 12px rgba(0, 0, 0, 0.15);
        }

        /* Toggle switch */
        .toggle-wrapper {
            position: absolute;
            top: 20px;
            right: 30px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 24px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            background-color: #ccc;
            border-radius: 24px;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            transition: 0.4s;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            border-radius: 50%;
            transition: 0.4s;
        }

        input:checked + .slider {
            background-color: #2196F3;
        }

        input:checked + .slider:before {
            transform: translateX(26px);
        }

        .slider.round {
            border-radius: 24px;
        }

        .slider.round:before {
            border-radius: 50%;
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                padding: 30px;
            }

            .left {
                padding-right: 0;
                margin-bottom: 30px;
            }
        }
    </style>
</head>
<body>

    <div class="toggle-wrapper">
        <label>🌞</label>
        <label class="switch">
            <input type="checkbox" id="themeToggle">
            <span class="slider round"></span>
        </label>
        <label>🌙</label>
    </div>

    <div class="container">
        <div class="left">
            <h1>🎓 Student Hub</h1>
            <p>Welcome to your centralized system for managing student data efficiently and beautifully.</p>
        </div>

        <div class="right">
            <h2>Dashboard</h2>
            <div class="button-grid">
                <a class="button" th:href="@{/Student/list}">📋 View Students</a>
                <a class="button" th:href="@{/Student/add}">➕ Add Student</a>
                <a class="button" th:href="@{/Student/edit}">✏️ Edit Student</a>
                <a class="button" th:href="@{/Student/delete}">🗑️ Delete Student</a>
            </div>
        </div>
    </div>

    <script>
        const toggle = document.getElementById('themeToggle');
        const body = document.body;

        toggle.addEventListener('change', () => {
            body.classList.toggle('dark-mode');
        });
    </script>

</body>
</html>
